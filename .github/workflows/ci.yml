name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Limmit-Z/rag-eval
          ref: main
          path: rag-eval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi uvicorn pytest httpx
      - run: python run_router_eval.py
      - run: python run_demo.py
      - run: python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: router-eval
          path: out/router_eval.md
