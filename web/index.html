<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>极光办公演示</title><style>
body{font:16px system-ui;background:#f4f6fb;color:#22304b;max-width:850px;margin:2rem auto;padding:0 1rem}header,article{background:white;border:1px solid #dce4f0;border-radius:12px;padding:1rem;margin:.8rem 0}select,input,button{font:inherit;padding:.55rem}input{width:min(70%,35rem)}.badge{display:inline-block;background:#e8eeff;color:#284e9f;border-radius:12px;padding:.2rem .6rem;margin:.2rem}.answer{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#536783}</style></head><body>
<h1>极光办公 · 演示对话</h1><header><label>演示账号 <select id="account"><option>alice</option><option>bob</option></select></label><button id="login">登录</button><span id="status">请先登录</span></header>
<main id="messages"></main><form id="form"><input id="question" placeholder="输入问题" required><button>发送</button></form><p>演示项目，产品与数据均为虚构。</p>
<script>
const base='http://127.0.0.1:8000';let session=null;const $=id=>document.getElementById(id);
async function post(path,body){const response=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.detail||'请求失败');return data}
$('login').onclick=async()=>{try{const data=await post('/login',{user_id:$('account').value});session=data.session_id;$('status').textContent='已登录，30 分钟内有效';$('messages').replaceChildren()}catch(e){session=null;$('status').textContent=e.message}};
$('form').onsubmit=async e=>{e.preventDefault();if(!session){$('status').textContent='请先登录';return}const question=$('question').value.trim();if(!question)return;const card=document.createElement('article'),q=document.createElement('strong'),a=document.createElement('div');q.textContent=question;a.className='answer';card.append(q,a);$('messages').append(card);$('question').value='';try{const data=await post('/chat',{session_id:session,question});for(const result of data.results){const badge=document.createElement('span');badge.className='badge';badge.textContent=result.agent;card.insertBefore(badge,a)}if(data.clarify){const badge=document.createElement('span');badge.className='badge';badge.textContent='请补充';card.insertBefore(badge,a)}a.textContent=data.answer}catch(err){a.textContent=err.message}};
</script></body></html>
